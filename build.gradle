buildscript {
    allprojects {
        gradle.projectsEvaluated {
            allprojects {
                jar { enabled = true }
            }
        }
    }
}

plugins {
    id 'org.springframework.boot' version '2.7.5'
}

allprojects {
    repositories {
        mavenLocal()
        maven { url 'https://maven.aliyun.com/repository/public/' }
        mavenCentral()
    }

    group 'com.hublotcloud'
    version '0.0.1'

    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'application'
}

subprojects {
    sourceCompatibility = 1.8
    targetCompatibility = 1.8

    dependencies {
        implementation ('org.springframework.boot:spring-boot-starter-web') {
            exclude module: 'spring-boot-starter-tomcat'
        }
        implementation ('org.springframework.boot:spring-boot-starter-undertow') {
            exclude module: 'undertow-websockets-jsr'
        }
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-freemarker'
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
	    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        implementation 'com.integralblue:log4jdbc-spring-boot-starter:2.0.0'
        implementation 'com.github.xiaoymin:knife4j-openapi2-spring-boot-starter:4.4.0'
        implementation 'org.postgresql:postgresql'
        implementation 'com.drewnoakes:metadata-extractor:2.15.0'
    }

}
